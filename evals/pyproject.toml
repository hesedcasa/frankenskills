[project]
name = "fsevals"
version = "0.1.0"
description = "Evals for the frankenskills spec/plan/build/test/review skills"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "pyyaml>=6.0", "datasets>=2.18"]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[project.scripts]
fsevals = "fsevals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fsevals*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["E741"]
